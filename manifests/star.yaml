# Stage-0 controls: capacity vs interference on kv4 (STAR pre-requisites).
#
# 4 grid runs (m x n_segments) + 1 seed-repro repeat of the m=4/n=2 cell
# (2026-08-05/08-14 note: same-seed runs must reproduce; compare loss curves
# of run idx 3 and the stage0_seed_repro run).
#
# Decision after completion:
#   - m=3 fails at n_segments=1  -> capacity problem -> pilot uses m=4
#   - m=3 passes 1seg, fails 2seg -> interference     -> pilot uses m=3
# Metrics: eval_exact_match per cell (forgetting gap G = EM_1seg - EM_2seg)
# + forgetting matrices at each per_segment_eval cadence.
max_parallel: 6
schedule: interleaved
experiments:
  - name: star
    command: "python run_from_config.py --config"
    base_config: "configs/gradmemgpt/kv_retrieval/adaptive_star_mamba.yaml"
    overrides:
      gradmem.use_mem_proj: false
      gradmem.mem_proj_mode: "none"
      gradmem.add_inner_loss_to_outer: false
      gradmem.n_mem_tokens: 2
      segmentation.n_segments: 4
      model.base_model: llama
      dataset.data_name: N8-K2V2-V62_1M
      dataset.data_path: "/home/jovyan/dzhivelikian/test_time_gd/data/N8-K2V2-V62_1M"
    grid:
      adaptive.memory_update_rule: ["sgd"]
      adaptive.star_weight: [0.0, 0.5]
      adaptive.star_gamma: [0.1] 
      training.seed: [4378, 43894, 2343]
