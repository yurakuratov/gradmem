# GradMemGPT on KV-retrieval - default configuration

# Output-folder controls (all optional, top-level):
#   runs_dir: "./runs"      # output root prefix (default: ./runs)
#   run_name: "my_run"      # override the auto-generated hyperparameter folder component (default: auto)
# A unique per-run postfix (run_<seed>_<uid8>) is always appended so runs never
# overwrite each other; when comet_ml is available, <uid8> is the first 8 chars
# of the comet experiment key, tying the folder to the comet run.
# runs_dir: "./runs"
# run_name: null
#
# Run naming (optional). By default the auto name is built from per-model-type
# logic. Set run_naming.keys to instead build it generically from the listed
# config keys (fully replacing the default logic). Each entry is either a plain
# "section.key" string (prefix defaults to the key name) or a {key, prefix} map
# for a short prefix. Missing/None/False values are skipped; True renders as the
# flag name. The resulting name is also forwarded to comet_ml as the experiment
# name (otherwise comet falls back to a random name).
# run_naming:
#   separator: "_"
#   keys:
#     - {key: training.learning_rate, prefix: lr}
#     - gradmem.K
#     - {key: training.total_batch_size, prefix: bs}
#     - gradmem.use_write_head
#
# Resume / fine-tune from a checkpoint (optional, top-level). Points to a
# model.safetensors file written by a previous run (e.g. under
# <exp_path>/best_model/ or <exp_path>/checkpoint-<step>/). The weights are
# loaded with strict=False, so a partial match is fine — missing keys are
# randomly initialized and unexpected keys are ignored. Use this to warm-start
# the WRITE pathway (e.g. pretrain on clean data, then fine-tune on noisy data)
# or to continue training.
# init_checkpoint: "./runs/<data_name>/<run_name>/run_<seed>_<uid8>/best_model/model.safetensors"

model:
  base_model: gpt2
  n_layer: 4
  n_head: 4
  n_embd: 128

training:
  per_device_batch_size: 64
  total_batch_size: 64
  # auto_find_batch_size: true  # automatically find max batch size that fits in GPU memory
  learning_rate: 1.0e-4
  max_steps: 1000000
  eval_steps: 500
  logging_steps: 500
  warmup_steps: 10000
  early_stopping_patience: 500
  seed: 143

dataset:
  data_path: "./data/N4-K2V2-V62_1M"
  tokenizer_path: "./tokenizers/kv_alphabet_62/"

gradmem:
  n_mem_tokens: 8
  n_ctrl_tokens: 0
  K: 2
  last_K_second_order: 2
  inner_lr: 0.04
  inner_clip_value: null
  inner_clip_norm: null
  use_adam: false
  grad_mode: "second"
  use_mem_proj: false
  mem_proj_mode: "none"
  use_write_head: true
  add_inner_loss_to_outer: true
  inner_loss_weight: 0.5

# Unified segmentation (both models): controls how the WRITE context is
# chunked into segments. n_segments/segment_size are mutually exclusive
# (segment_size wins: n_segments = ceil(S / segment_size)). Pair-aware mode
# chunks at !K:V! pair boundaries instead of fixed-width token windows, so a
# pair's key and value are never split across segments (a window boundary
# between them makes the pair unretrievable from any single Hopfield/GD slot;
# on N8-K2V2 with 4x16-token windows that hit pair 5 of 8 in every sample).
# Delimiter token ids are auto-filled from the tokenizer. Exactly one sizing
# mode: pairs_per_segment: N -> ceil(n_pairs/N) segments per sample; neither
# -> divide n_pairs equally over n_segments (8 pairs / 4 -> 2/2/2/2).
# segmentation:
#   n_segments: 4
#   segment_size: null
#   pair_aware_segmentation: true
#   pairs_per_segment: 2