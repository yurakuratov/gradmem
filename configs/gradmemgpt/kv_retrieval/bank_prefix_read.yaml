# GradMemGPT with the BANK-PREFIX control read (docs/TOKENWISE_READ.md, arm (b))
#
# The recall UPPER BOUND that decides H2: at READ, ALL stored per-segment
# memory tokens are prepended to the query as an ordinary causal prefix
# ([read_st?, bank, read_end?, query]) and the backbone attends over them --
# no state, no hooks, no retrieval mixture. O(N) context by design, so this
# arm is a diagnostic, not a deployable architecture. Decisive in the failure
# branch: if the bank prefix ALSO fails ordered-concat, write quality is
# implicated and H2 (read-interface bottleneck) is rejected. The Hopfield
# STORE appends raw post-inner-loop memories exactly as in
# linear_state_read.yaml; hopfield_bptt_segments bounds the prefix's graph.

run_naming:
  separator: "_"
  keys:
    - {key: segmentation.n_segments, prefix: ns}
    - {key: gradmem.n_mem_tokens, prefix: m}
    - {key: gradmem.K, prefix: K}
    - {key: hopfield.use_hopfield_memory, prefix: hopfield}
    - {key: read_linear.use_bank_prefix_read, prefix: bank}
    - {key: dataset.data_name, prefix: ds_}

model:
  base_model: gpt2
  n_layer: 4
  n_head: 4
  n_embd: 128

training:
  per_device_batch_size: 64
  total_batch_size: 64
  learning_rate: 1.0e-4
  max_steps: 300000
  eval_steps: 500
  logging_steps: 500
  warmup_steps: 10000
  early_stopping_patience: 250
  seed: 143
  per_segment_eval: true
  per_segment_eval_steps: 2500

dataset:
  data_path: "./data/N8-K2V2-V62-S4-ordered_pair_cross_1M"
  tokenizer_path: "./tokenizers/kv_alphabet_62/"

gradmem:
  n_mem_tokens: 2
  n_ctrl_tokens: 0
  K: 2
  last_K_second_order: null
  inner_lr: 0.04
  inner_clip_value: null
  inner_clip_norm: null
  use_adam: false
  grad_mode: "second"
  use_mem_proj: false
  mem_proj_mode: "none"
  use_write_head: true
  add_inner_loss_to_outer: true
  inner_loss_weight: 0.5
  memory_update: gradient
  use_mem_residual: false
  use_reconstruction_loss: false
  reconstruction_loss_weight: 1.0

segmentation:
  n_segments: 4
  segment_size: null
  pair_aware_segmentation: true
  # pairs_per_segment: 2

hopfield:
  use_hopfield_memory: true
  hopfield_bptt_segments: null

read_linear:
  use_linear_state_read: false
  # the control arm: the whole bank as the READ prefix (upper bound)
  use_bank_prefix_read: true
