# GradMemGPT with the linear-state read, INTERFACE-token variant
# (docs/TOKENWISE_READ.md, "Variant"). Same per-head states and per-layer
# gated additive reads as linear_state_read.yaml, but the bias is injected
# only at the M = n_mem_tokens learnable interface tokens (a dedicated M_0),
# in a two-pass layout:
#   pass 1 (conditioning): [query (target-span blinded), M_0] -- the interface
#          tokens attend the query AND read the state at each layer;
#   pass 2 (answering):    [interface, query] with the pass-1 interface
#          states as their inputs; answer positions reach memory only through
#          softmax attention over the interface tokens.
# Read sites M*L instead of T*L*H_r: the read-site ablation against
# linear_state_read.yaml. Everything else identical.

run_naming:
  separator: "_"
  keys:
    - {key: segmentation.n_segments, prefix: ns}
    - {key: gradmem.n_mem_tokens, prefix: m}
    - {key: gradmem.K, prefix: K}
    - {key: hopfield.use_hopfield_memory, prefix: hopfield}
    - {key: read_linear.use_linear_state_read, prefix: lsr}
    - {key: read_linear.read_state_read_sites, prefix: sites}
    - {key: read_linear.read_state_heads, prefix: rh}
    - {key: dataset.data_name, prefix: ds_}

model:
  base_model: gpt2
  n_layer: 4
  n_head: 4
  n_embd: 128

training:
  per_device_batch_size: 64
  total_batch_size: 64
  learning_rate: 1.0e-4
  max_steps: 300000
  eval_steps: 500
  logging_steps: 500
  warmup_steps: 10000
  early_stopping_patience: 250
  seed: 143
  per_segment_eval: true
  per_segment_eval_steps: 2500

dataset:
  data_path: "./data/N8-K2V2-V62-S4-ordered_pair_cross_1M"
  tokenizer_path: "./tokenizers/kv_alphabet_62/"

gradmem:
  n_mem_tokens: 2
  n_ctrl_tokens: 0
  K: 2
  last_K_second_order: null
  inner_lr: 0.04
  inner_clip_value: null
  inner_clip_norm: null
  use_adam: false
  grad_mode: "second"
  use_mem_proj: false
  mem_proj_mode: "none"
  use_write_head: true
  add_inner_loss_to_outer: true
  inner_loss_weight: 0.5
  memory_update: gradient
  use_mem_residual: false
  use_reconstruction_loss: false
  reconstruction_loss_weight: 1.0

segmentation:
  n_segments: 4
  segment_size: null
  pair_aware_segmentation: true
  # pairs_per_segment: 2

hopfield:
  use_hopfield_memory: true
  hopfield_bptt_segments: null

read_linear:
  use_linear_state_read: true
  read_state_heads: 4
  read_state_layers: "all"
  read_state_beta_init: 1.0
  read_state_gate_init: 0.1
  read_state_read_sites: interface   # <-- the Variant: M learnable interface tokens
  read_state_exact_softmax: false
