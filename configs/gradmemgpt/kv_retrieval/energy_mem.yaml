# GradMemGPT on KV-retrieval - learnable energy inner objective, Option B (mem_tokens read-out).
# Variant of energy.yaml: instead of dedicated energy tokens, the memory tokens themselves are
# placed at the END of the WRITE context and their last-layer hidden states feed the energy MLP.
# mem is both the optimised variable and the read-out (no separate energy-token param).
# Note: mem is optimised as a suffix but still used as a prefix in READ -> positional mismatch.
# Requires memory_update="gradient" + grad_mode="second".

model:
  base_model: gpt2
  n_layer: 4
  n_head: 4
  n_embd: 128

training:
  per_device_batch_size: 64
  total_batch_size: 64
  learning_rate: 1.0e-4
  max_steps: 1000000
  eval_steps: 500
  logging_steps: 500
  warmup_steps: 10000
  early_stopping_patience: 500
  seed: 143

dataset:
  data_path: "./data/N4-K2V2-V62_1M"
  tokenizer_path: "./tokenizers/kv_alphabet_62/"

gradmem:
  n_mem_tokens: 8
  n_ctrl_tokens: 0
  K: 2
  last_K_second_order: 2  # full second-order (== K); energy head is trained via this path
  inner_lr: 0.04
  inner_clip_value: null
  inner_clip_norm: null
  use_adam: false
  grad_mode: "second"      # required for use_energy_inner_loss
  use_mem_proj: false
  mem_proj_mode: "none"
  use_write_head: false    # unused with energy inner loss (no vocab projection in inner loop)
  add_inner_loss_to_outer: false  # incompatible with use_energy_inner_loss
  inner_loss_weight: 0.0
  memory_update: gradient  # required for use_energy_inner_loss
  # Learnable energy inner objective (Option B)
  use_energy_inner_loss: true
  energy_readout: mem_tokens  # mem tokens at the end feed the energy MLP (MLP in_dim = n_mem_tokens*d)
  energy_mlp_hidden_dim: null  # null -> n_embd (128)
  energy_mlp_n_layers: 2
