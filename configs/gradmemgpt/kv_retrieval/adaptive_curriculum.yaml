# GradMemGPT — adaptive fork + curriculum learning on KV-retrieval.
#
# This combines two things (see CURRICULUM.md for the full guide):
#   1. The adaptive model (`adaptive:` section -> grad_memgpt_adaptive.py):
#      segmented WRITE context with CROSS-SEGMENT MEMORY CARRY and a gated
#      (Mamba-style) memory-update recurrence.
#   2. Curriculum learning (`curriculum:` section): train stage-by-stage on
#      KV-retrieval datasets of increasing difficulty (N KV pairs), advancing to
#      the next stage only once eval_exact_match on the current stage crosses
#      `curriculum_threshold`.
#
# Curriculum stages load `<curriculum_data_dir>/<curriculum_dataset_template
# formatted with n_kv>`. With the template "N{n_kv}-K2V2-V62_1M" and the levels
# below, the stages are:
#   stage 0 -> ./data/N4-K2V2-V62_1M   (4 KV pairs)
#   stage 1 -> ./data/N8-K2V2-V62_1M   (8 KV pairs)
#   stage 2 -> ./data/N16-K2V2-V62_1M  (16 KV pairs)
#   stage 3 -> ./data/N32-K2V2-V62_1M  (32 KV pairs)
#   stage 4 -> ./data/N64-K2V2-V62_1M  (64 KV pairs)
#   stage 5 -> ./data/N96-K2V2-V62_1M  (96 KV pairs)
#   stage 6 -> ./data/N128-K2V2-V62_1M (128 KV pairs)
# (All present locally; generate more via notebooks/dump_dataset.ipynb.)
#
# NOTE on segmentation x curriculum: as N grows, the WRITE context grows, so with
# a fixed `segment_size` the NUMBER of segments per stage grows too. This is the
# regime the adaptive fork is built for: each stage unrolls the gated recurrence
# over more segments, and information from early segments must survive. If you
# instead want a FIXED number of segments per stage, set `n_segments` and drop
# `segment_size`.

run_naming:
  separator: "_"
  keys:
    - {key: adaptive.segment_size, prefix: tk}
    - {key: adaptive.memory_update_rule, prefix: ur_}
    - {key: curriculum.threshold, prefix: thr}
    - {key: curriculum.levels, prefix: L}

model:
  base_model: gpt2
  n_layer: 4
  n_head: 4
  n_embd: 128

training:
  per_device_batch_size: 64
  total_batch_size: 64
  learning_rate: 1.0e-4
  max_steps: 1000000          # per-stage cap; a stage also ends when it crosses the threshold
  eval_steps: 500             # the curriculum metric is checked at every eval
  logging_steps: 500
  warmup_steps: 10000
  early_stopping_patience: 500
  seed: 143
  # Per-segment forgetting eval (adaptive model only): builds the [n_seg,n_seg]
  # forgetting matrix on its own cadence. Useful to *see* curriculum fighting
  # forgetting -- older facts (rows) degrade less at later probe segments (cols)
  # as stages progress. cadence must be a multiple of eval_steps.
  per_segment_eval: true
  per_segment_eval_steps: 2500   # = 5 * eval_steps

dataset:
  # Under curriculum these are largely inert for stage routing (the curriculum
  # loop loads each stage from the template below), but are still required to
  # build the tokenizer/collator and for the initial config sanity checks.
  data_name: "N4-K2V2-V62_1M"
  data_path: "./data/N4-K2V2-V62_1M"
  tokenizer_path: "./tokenizers/kv_alphabet_62/"

gradmem:
  n_mem_tokens: 8
  n_ctrl_tokens: 0
  K: 2
  last_K_second_order: 2
  inner_lr: 0.04
  inner_clip_value: null
  inner_clip_norm: null
  use_adam: false
  grad_mode: "second"
  use_mem_proj: false
  mem_proj_mode: "none"
  use_write_head: true
  add_inner_loss_to_outer: true
  inner_loss_weight: 0.5

adaptive:
  # ---- segmentation (cross-segment carry) ---- #
  # Exactly one of n_segments / segment_size should be set.
  n_segments: 1            # equal-sized segments (segment_size = ceil(S / n_segments))
  segment_size: 16         # fixed tokens-per-segment (n_segments = ceil(S / segment_size))
  seg_bptt: null           # truncated-BPTT window over segments (null = keep full graph)

  # ---- gated memory update ---- #
  memory_update_rule: "mamba"   # sgd | convex | mamba
  gate_features: "state"        # phi to gate heads: grad | state | grad_state
  gate_granularity: "per_dim"   # gate width: per_dim [B,M,d] | per_token [B,M,1]
  gate_retention: "exp"         # mamba retention form: exp (Mamba decay) | sigmoid (GRU gate)

  # ---- gate bias inits (calibrated so the operator starts as ~SGD) ---- #
  convex_bias_init: 3.0
  mamba_retain_bias_init: -5.0
  mamba_write_bias_init: 3.0

curriculum:
  curriculum_enabled: true
  curriculum_threshold: 0.9        # advance when eval_exact_match >= threshold
  curriculum_levels: "4,8,16,32,64,96,128"
  curriculum_data_dir: "./data"
  curriculum_dataset_template: "N{n_kv}-K2V2-V62_1M"
  # Per-stage hyperparameter overrides (optional). Keys are stage indices.
  # MODEL_PARAM_MAP (inner_lr, inner_clip_*, hopfield_*, gated_delta_*) are set
  # on BOTH model.<attr> and model.config.<attr>; the TRAINING set below is set
  # on args directly. Unknown keys are logged and skipped (not fatal).
  # stage_overrides:
  #   3: {inner_lr: 0.02}     # ease the inner step at higher N
  #   5: {inner_lr: 0.01, eval_steps: 1000}
