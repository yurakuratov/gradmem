# GradMemGPT with the linear-state per-level read (docs/TOKENWISE_READ.md)
#
# Replaces the Hopfield one-shot RETRIEVE + memory-prefix READ: the stored
# per-segment memories are folded once into per-head linear-attention states,
# and every decoder block injects a gated, per-token read of that state at its
# output (hooks; parallel additive). The READ sequence drops the memory
# prefix. The WRITE side (per-segment inner loops, STORE) is unchanged -- the
# Hopfield STORE just appends the raw post-inner-loop memories. Requires
# use_hopfield_memory; read the read_linear: comments below for the knobs.

run_naming:
  separator: "_"
  keys:
    - {key: segmentation.n_segments, prefix: ns}
    - {key: gradmem.n_mem_tokens, prefix: m}
    - {key: gradmem.K, prefix: K}
    - {key: hopfield.use_hopfield_memory, prefix: hopfield}
    - {key: read_linear.use_linear_state_read, prefix: lsr}
    - {key: read_linear.read_state_read_sites, prefix: sites}
    - {key: read_linear.read_state_heads, prefix: rh}
    - {key: read_linear.read_state_exact_softmax, prefix: exact}
    - {key: dataset.data_name, prefix: ds_}

model:
  base_model: gpt2
  n_layer: 4
  n_head: 4
  n_embd: 128

training:
  per_device_batch_size: 64
  total_batch_size: 64
  learning_rate: 1.0e-4
  max_steps: 300000
  eval_steps: 500
  logging_steps: 500
  warmup_steps: 10000
  early_stopping_patience: 250
  seed: 143
  per_segment_eval: true
  per_segment_eval_steps: 2500

dataset:
  # ordered pair concatenation: query ?!K1:?!K2: -> target V1!V2!| with the
  # two keys living in DIFFERENT segments (the cross-segment integration task
  # the one-shot read fails; PROGRESS.md facts 5-7)
  data_path: "./data/N8-K2V2-V62-S4-ordered_pair_cross_1M"
  tokenizer_path: "./tokenizers/kv_alphabet_62/"

gradmem:
  n_mem_tokens: 2
  n_ctrl_tokens: 0
  K: 2
  last_K_second_order: null
  inner_lr: 0.04
  inner_clip_value: null
  inner_clip_norm: null
  use_adam: false
  grad_mode: "second"
  use_mem_proj: false
  mem_proj_mode: "none"
  use_write_head: true
  add_inner_loss_to_outer: true
  inner_loss_weight: 0.5
  memory_update: gradient
  use_mem_residual: false
  use_reconstruction_loss: false
  reconstruction_loss_weight: 1.0

# Unified segmentation (both models; see default.yaml for the full knob docs)
segmentation:
  n_segments: 4
  segment_size: null
  pair_aware_segmentation: true   # chunk at !K:V! pair boundaries
  # pairs_per_segment: 2

hopfield:
  # Only the STORE side of the Hopfield mode is used by the linear-state read
  # (per-segment STORE of the raw post-inner-loop memories; retrieval modes /
  # projections / separate mems are NOT consumed -- the RETRIEVE phase is
  # skipped entirely when use_linear_state_read is on).
  use_hopfield_memory: true
  # Number of last segments kept in the BPTT graph; detaches the RAW stored
  # values exactly as it detaches keys/values in the one-shot mode (the read
  # sites multiply the outer graph through the stored values, so this knob
  # remains the memory lever).
  hopfield_bptt_segments: null

# Linear-state per-level read (TOKENWISE_READ.md). Mutually exclusive with
# use_gated_delta_memory and hopfield_value_proj_dim (values are the raw
# post-inner-loop memory tokens). Read-module params are OUTER-loop only.
read_linear:
  use_linear_state_read: true
  # H_r read heads; head dim = n_embd / read_state_heads (wider heads reduce
  # state cross-talk; state cost O(d^2/H_r) either way)
  read_state_heads: 4
  # which decoder blocks get the read hook: "all" or a list of indices
  read_state_layers: "all"
  # initial retrieval sharpness beta_r^l (L2-normalized queries, learnable)
  read_state_beta_init: 1.0
  # initial per-layer gate gamma^l (LayerScale-style small-positive init;
  # drop this first if early training is unstable)
  read_state_gate_init: 0.1
  # "all" = bias at every real position of the read sequence; "interface" =
  # only at the M learnable interface tokens (two-pass layout)
  read_state_read_sites: all
  # ablation: exact softmax over the unfolded bank per token (O(N)) instead
  # of the superposed state read
  read_state_exact_softmax: false
