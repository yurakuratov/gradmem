# GradMemGPT on KV-retrieval - learnable energy-based inner-loop objective.
# Instead of minimising reconstruction CE in the inner loop, the outer loop
# meta-learns a scalar "energy" (energy_tokens + energy_mlp) whose minimum
# yields task-useful memory. Requires memory_update="gradient" + grad_mode="second".

model:
  base_model: gpt2
  n_layer: 4
  n_head: 4
  n_embd: 128

training:
  per_device_batch_size: 64
  total_batch_size: 64
  learning_rate: 1.0e-4
  max_steps: 1000000
  eval_steps: 500
  logging_steps: 500
  warmup_steps: 10000
  early_stopping_patience: 500
  seed: 143

dataset:
  data_path: "./data/N4-K2V2-V62_1M"
  tokenizer_path: "./tokenizers/kv_alphabet_62/"

gradmem:
  n_mem_tokens: 8
  n_ctrl_tokens: 0
  K: 2
  last_K_second_order: 2  # full second-order (== K); energy head is trained via this path
  inner_lr: 0.04
  inner_clip_value: null
  inner_clip_norm: 5
  use_adam: false
  grad_mode: "second"      # required for use_energy_inner_loss
  use_mem_proj: false
  mem_proj_mode: "none"
  use_write_head: false    # unused with energy inner loss (no vocab projection in inner loop)
  add_inner_loss_to_outer: false  # incompatible with use_energy_inner_loss
  inner_loss_weight: 0.0
  memory_update: gradient  # required for use_energy_inner_loss
  # Learnable energy inner objective
  use_energy_inner_loss: true
  n_energy_tokens: 4
  energy_mlp_hidden_dim: null  # null -> n_embd (128)
  energy_mlp_n_layers: 2
