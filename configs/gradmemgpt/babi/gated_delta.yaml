# GradMemGPT with Gated DeltaNet-style external memory
# Gated Delta rule: S_t = S_{t-1} (alpha_t (I - beta_t k_t k_t^T)) + beta_t v_t k_t^T
# Alternative to Hopfield memory (use_hopfield_memory). Mutually exclusive.
run_name: 'delta_256_64tk_qa3_c19_r0'

model:
  pretrained_model: gpt2

training:
  per_device_batch_size: 64  # qa3_1k - 10, qa3_0k - 5
  total_batch_size: 64
  learning_rate: 1.0e-4
  max_steps: 1000000
  eval_steps: 250
  logging_steps: 250
  warmup_steps: 10000
  early_stopping_patience: 400
  seed: 143

dataset:
  data_name: "babilong_qa3_1k_c19_ratio0"
  data_path: "/home/jovyan/dzhivelikian/test_time_gd/data/babilong_qa3_1k_c19_ratio0"
  tokenizer_path: "./tokenizers/kv_alphabet_62/"

gradmem:
  n_mem_tokens: 8
  n_ctrl_tokens: 0
  K: 2
  last_K_second_order: null
  inner_lr: 0.04
  inner_clip_value: null
  inner_clip_norm: null
  use_adam: false
  grad_mode: "second"
  use_mem_proj: false
  mem_proj_mode: "none"
  use_write_head: true
  add_inner_loss_to_outer: true
  inner_loss_weight: 0.5
  memory_update: gradient  # gradient | forward (RMT style)
  # Reconstruction-only pretrain warmup
  recon_pretrain_steps: 0        # steps of recon-first warmup (then linear ramp to normal)
  recon_pretrain_target_weight: 0.0 # target-loss weight at step 0 (0 = pure reconstruction)
  recon_pretrain_recon_weight: 0.0  # extra weight on inner reconstruction loss at step 0
  # RMT forward
  use_mem_residual: false  # for RMT
  use_reconstruction_loss: false  # reconstruction loss for RMT
  reconstruction_loss_weight: 1.0
  # WRITE-phase LoRA (reconstruction path)
  use_write_lora: false
  write_lora_r: 8
  write_lora_alpha: 16
  write_lora_dropout: 0.0
  # READ-phase LoRA (target path); disjoint adapter set from write
  use_read_lora: false
  read_lora_r: 8
  read_lora_alpha: 16
  read_lora_dropout: 0.0
  # freeze_backbone omitted => auto-freezes (since either LoRA is on).
  # Set freeze_backbone: false explicitly to keep the base trainable too.

hopfield:
  hopfield_segment_size: 64  # shared segmenting logic (also used by gated_delta)
  hopfield_n_segments: 1

gated_delta:
  use_gated_delta_memory: true
  gated_delta_state_dim: 256  # d_k = d_v for state matrix S (B, d, d)
  gated_delta_alpha_init: 0.9  # initial forget gate (sigmoid bias)
  gated_delta_beta_init: 0.5  # initial write strength (sigmoid bias)
  gated_delta_bptt_segments: null  # number of last segments to keep in BPTT graph (null = all)

