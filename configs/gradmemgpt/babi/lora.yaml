# GradMemGPT on bAbI with phase-specific LoRA (write + read) on a frozen backbone.
# Decouples WRITE (reconstruction) and READ (target) parameter paths so the two
# losses no longer compete through shared backbone weights.

model:
  pretrained_model: gpt2

training:
  per_device_batch_size: 1
  total_batch_size: 1
  learning_rate: 1.0e-4
  max_steps: 200000
  eval_steps: 500
  logging_steps: 500
  warmup_steps: 10000
  early_stopping_patience: 500
  seed: 142

dataset:
  data_name: "babilong_qa1_0k"
  data_path: "./data/babilong_qa1_0k"
  tokenizer_path: "./tokenizers/kv_alphabet_62/"

gradmem:
  n_mem_tokens: 8
  n_ctrl_tokens: 0
  K: 2
  inner_lr: 0.04
  use_adam: false
  grad_mode: "second"
  use_mem_proj: true
  mem_proj_mode: "proj"
  use_write_head: true
  # WRITE-phase LoRA (reconstruction path)
  use_write_lora: true
  write_lora_r: 8
  write_lora_alpha: 16
  write_lora_dropout: 0.0
  # READ-phase LoRA (target path); disjoint adapter set from write
  use_read_lora: true
  read_lora_r: 8
  read_lora_alpha: 16
  read_lora_dropout: 0.0
  # freeze_backbone omitted => auto-freezes (since either LoRA is on).
  # Set freeze_backbone: false explicitly to keep the base trainable too.
