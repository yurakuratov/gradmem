container:
  image: "cr.ai.cloud.ru/aicloud-base-images/cuda12.3-torch2-py310:0.0.37"

  # CMD to run
  command: 'python -m pip install --user uv && $HOME/.local/bin/uv cache dir && $HOME/.local/bin/uv sync && $HOME/.local/bin/uv run python run_scheduler.py manifests/kv_hopfield.yaml && rm -r .venv'

  # ENV vars
  environment:
    "HF_HOME": "$HF_HOME"
    "HF_TOKEN": "$HF_TOKEN"
    "TRITON_CACHE_DIR": "$TRITON_CACHE_DIR"
    "COMET_API_KEY": "$COMET_API_KEY"
    "COMET_PROJECT_NAME": "gradmem-mem-stage0-inter"
    "COMET_WORKSPACE": "$COMET_WORKSPACE"
    "COMET_MODE": "online"
    # Added to job description
    "TEAM_NAME": "gradmem/$ME"
    "MY_HOME": "$MY_HOME"
    "UV_CACHE_DIR": "$UV_CACHE_DIR"
  
  # Local working directory, recommend leaving as default
  work_dir: '.'

  # Whether to run from a copy of the working directory
  run_from_copy: True

  # Local path for creating working directory copies
  cry_copy_dir: "$MY_HOME/.cryri"
  exclude_from_copy:
    - ".venv"
    - ".git"
    - "notebooks"
    - "data"

cloud:
  region: "SR006"
  
  # Type of cloud instance (check the command to list available instances in cryri readme)
  instance_type: "a100plus.1gpu.80vG.12C.96G"

  # Number of worker instances, 1 is the only option
  n_workers: 1
  
  # Job description 
  description: "hopfield"
